# Every model experiments can call, by nickname. See README.md.
#   api          where requests go: "anthropic", "openai", or "abliteration" (direct), or "openrouter"
#   id           the model's name on that API
#   max_tokens   the longest reply allowed; every request asks for this much unless told otherwise
#   thinks       true for Claude models that think even when not asked to, so their thinking is always shown
#                (asking to see it would make other Claude models think)
#   temperature  false if the API rejects a temperature setting (asking for one then raises an error; the model
#                runs at 1, see README.md)
#   reasoning_levels
#                the reasoning levels the model really has, when its API takes more names than that and quietly
#                runs some as another level; any other level raises an error
#   price        dollars per million tokens, for direct APIs (OpenRouter reports each call's cost itself);
#                cache_write is a 5-minute cache write, cache_write_1h a 1-hour one (Anthropic only)
#   long_price   prices used instead when a prompt is over `above` tokens (OpenAI only; Anthropic has no surcharge)
#   host         for OpenRouter, the single host every request is pinned to
#   caching      "free": the provider caches automatically at no extra cost, so the library leaves it alone
#                "paid": saving to the cache costs extra, so nothing is cached unless asked (see README.md)
#                "none": the host doesn't cache
#
# Keep this current by checking prices once a month, whenever you add a model, and before any big run.
#   Prices last checked 2026-10-02 against
#     https://platform.claude.com/docs/en/about-claude/pricing
#     https://developers.openai.com/api/docs/pricing
#     https://docs.abliteration.ai/pricing (or GET https://api.abliteration.ai/v1/models, which lists them per token)
#   OpenRouter hosts and output limits: run `await LLM().check(list(MODELS))` (free) and see
#     https://openrouter.ai/<model id>/providers
#   Don't take Anthropic or OpenAI prices from OpenRouter.

