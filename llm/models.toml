# abliteration.ai: open-weight models with refusal behavior removed ("abliterated"), served directly. They cache
# automatically; a cache write costs the normal input price. The API reports no cost, so it is computed from these
# prices. Checked 2026-10-22.

["abliterated"]
api = "abliteration"
id = "abliterated-model"  # Base model not published
caching = "free"
max_tokens = 262_134
price = { input = 1.00, output = 3.00, cache_read = 0.10, cache_write = 1.00 }

["abliterated-large-v2"]
api = "abliteration"
id = "abliterated-model-large-v2"  # GLM 5.3
caching = "free"
# The API takes every level but runs none and minimal as low (hiding the reasoning for none), medium as high, and
# xhigh as max.
reasoning_levels = ["low", "high", "max"]
max_tokens = 999_990
price = { input = 3.00, output = 5.00, cache_read = 0.30, cache_write = 3.00 }

["abliterated-large"]
api = "abliteration"
id = "abliterated-model-large"  # GLM 5.2
caching = "free"
reasoning_levels = ["none", "high", "max"]  # The API runs minimal through medium as high, and xhigh as max.
max_tokens = 999_990
price = { input = 3.00, output = 5.00, cache_read = 0.30, cache_write = 3.00 }
