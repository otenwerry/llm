[project]
name = "llm"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.8.0",
    "openai>=3.19.0",
    "python-dotenv",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llm"]
